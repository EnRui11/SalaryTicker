# The generated .xcodeproj is not in the repository, for the same reason the app icon is
# not: it is output, and a checked-in copy drifts from the thing that produces it. This
# file is the source of truth, and Packaging/build_ios.sh regenerates the project.
#
# An Xcode project is unavoidable for iOS. SwiftPM will appear to cross-compile with -sdk
# passed through to swiftc and silently keep the macOS sysroot instead.
name: SalaryTickerMobile
options:
  bundleIdPrefix: com.steve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SalaryTicker:
    path: .

targets:
  SalaryTickerMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS/App
    dependencies:
      - package: SalaryTicker
        product: SalaryDomain
      - package: SalaryTicker
        product: SalaryApplication
      - package: SalaryTicker
        product: SalaryShared
      - package: SalaryTicker
        product: SalaryCore
      - package: SalaryTicker
        product: SalaryPresentation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.steve.salaryticker.mobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Simulator only for now: there is no signing identity on this machine, so a real
        # device needs an Apple ID adding in Xcode first.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
