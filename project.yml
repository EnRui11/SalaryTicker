# The generated .xcodeproj is not in the repository, for the same reason the app icon is
# not: it is output, and a checked-in copy drifts from the thing that produces it. This
# file is the source of truth, and Packaging/build_ios.sh regenerates the project.
#
# An Xcode project is unavoidable for iOS. SwiftPM will appear to cross-compile with -sdk
# passed through to swiftc and silently keep the macOS sysroot instead.
name: SalaryTickerMobile
options:
  bundleIdPrefix: com.steve
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  SalaryTicker:
    path: .

targets:
  SalaryTickerMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS/App
    dependencies:
      - package: SalaryTicker
        product: SalaryDomain
      - package: SalaryTicker
        product: SalaryApplication
      - package: SalaryTicker
        product: SalaryShared
      - package: SalaryTicker
        product: SalaryGlass
      - package: SalaryTicker
        product: SalaryCore
      - package: SalaryTicker
        product: SalaryPresentation
      - package: SalaryTicker
        product: SalarySync
      - package: SalaryTicker
        product: SalaryActivity
      - target: SalaryTickerLiveActivity
        embed: true
        codeSign: false
      # The phone carries the watch app, so installing one installs the other and the pair
      # is a pair from the moment either exists.
      - target: SalaryTickerWatch
        embed: true
        codeSign: false
    # Written out rather than generated, because the URL scheme the Mac's QR code points
    # at is an array and INFOPLIST_KEY_ settings only carry scalars.
    info:
      path: Sources/iOS/App/Info.plist
      properties:
        CFBundleDisplayName: SalaryTicker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.steve.salaryticker.mobile
            CFBundleURLSchemes: [salaryticker]
        # Without this the activity request is refused and nothing says why.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve.salaryticker.mobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Simulator only for now: there is no signing identity on this machine, so a real
        # device needs an Apple ID adding in Xcode first.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

  # The watch app is independent: it does not need the phone to be installed, and it holds
  # its own settings. Getting a configuration onto it is still the open question -- a watch
  # cannot scan a QR code, so the answer is WatchConnectivity from the phone, and that is
  # not built yet.
  SalaryTickerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/watchOS/App
    dependencies:
      - package: SalaryTicker
        product: SalaryDomain
      - package: SalaryTicker
        product: SalaryApplication
      - package: SalaryTicker
        product: SalaryShared
      - package: SalaryTicker
        product: SalaryGlass
      - package: SalaryTicker
        product: SalaryCore
      - package: SalaryTicker
        product: SalaryPresentation
      - package: SalaryTicker
        product: SalarySync
      - target: SalaryTickerComplication
        embed: true
    info:
      path: Sources/watchOS/App/Info.plist
      properties:
        CFBundleDisplayName: SalaryTicker
        WKApplication: true
        # The counterpart of the phone app rather than a standalone. WCSession exists only
        # between a watch app and its companion, so "independent" and "receives the phone's
        # settings" cannot both be true, and receiving the settings is what makes it usable.
        WKCompanionAppBundleIdentifier: com.steve.salaryticker.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve.salaryticker.mobile.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

  # The complication. Its timeline is worked out by ComplicationTimeline in the application
  # layer, which is unit tested; this target is the shell that hands it to WidgetKit.
  SalaryTickerComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/watchOS/Complication
    dependencies:
      - package: SalaryTicker
        product: SalaryDomain
      - package: SalaryTicker
        product: SalaryApplication
      - package: SalaryTicker
        product: SalaryShared
      - package: SalaryTicker
        product: SalaryCore
    info:
      path: Sources/watchOS/Complication/Info.plist
      properties:
        CFBundleDisplayName: SalaryTicker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve.salaryticker.mobile.watchkitapp.complication
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

  # The Dynamic Island and the lock screen. Everything that moves on it is animated by iOS
  # across a date range, so it keeps running long after the app that started it has gone.
  SalaryTickerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/iOS/LiveActivity
    dependencies:
      - package: SalaryTicker
        product: SalaryActivity
    info:
      path: Sources/iOS/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: SalaryTicker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve.salaryticker.mobile.liveactivity
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
